# CrossToolGuard lab — isolated `ctg-lab` network, synthetic data only.
# Task 0: `docker compose config` validates. `up` goes live in Task 1
# once crosstoolguard.gateway.proxy implements the FastAPI app.
# Total memory capped for MacBook Air M2 8GB (proxy ≤2GB).

networks:
  ctg-lab:
    driver: bridge
    internal: true

services:
  proxy:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODE=monitor
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    mem_limit: 2g
    networks:
      - ctg-lab
